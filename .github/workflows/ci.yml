name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run the application tests
        # CHAT_PROVIDER/MANDISENSE_LLM_PROVIDER are forced off in tests/conftest.py, so no key or network is needed.
        run: python -m pytest mandisense_ai -q -p no:cacheprovider
      - name: Check the pipeline orchestrator resolves
        run: python scripts/pipeline.py --dry-run

  frontend:
    name: Frontend type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint (errors fail the build; warnings are tracked but allowed)
        run: npx eslint . --quiet
      - name: Production build
        # Retried up to three times: three runs (two on feature/farmer-real-data, one on main) failed here while the identical commit passed
        # in the sibling run, and the build passes locally every time. The layout downloads five Google font families at build time, the
        # likely culprit (a network flake), but the runner log was not readable, so the cause is unconfirmed. A real build error fails all 3.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "::warning title=Production build::attempt ${attempt} failed"
            sleep 10
          done
          exit 1
