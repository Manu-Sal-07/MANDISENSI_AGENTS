name: Daily data refresh

# Pulls the day's Agmarknet prices (data.gov.in), re-scores the forecasts, and commits the refreshed store to main, which makes Render
# redeploy with current data. This replaces the in-process scheduler in production: a free Render instance sleeps when idle and its
# disk is wiped on every restart, so anything it ingested was lost. A commit is durable, reviewable and rolls back with git revert.

on:
  schedule:
    - cron: "30 13 * * *"   # 19:00 IST, after most mandis have reported for the day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Probe data.gov.in from this runner
        # Reports reachability and latency as an annotation (readable without log access) and never fails the job by itself.
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          key="${DATAGOV_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}"
          set +e
          result=$(curl -sS -m 25 -o /dev/null -w "HTTP %{http_code} in %{time_total}s" \
            "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?api-key=${key}&format=json&limit=1&filters%5Bstate.keyword%5D=Karnataka" 2>&1)
          code=$?
          if [ $code -eq 0 ]; then echo "::notice title=data.gov.in probe::${result}"; else echo "::warning title=data.gov.in probe::curl exit ${code}: ${result}"; fi
          exit 0

      - name: Ingest, retrain on cadence, forecast, publish
        timeout-minutes: 12
        env:
          # Optional: a registered key avoids the shared sample key's rate limit. Add it under Settings > Secrets > Actions.
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python scripts/run_nightly_job.py

      - name: Smoke-check the refreshed artefacts load and serve
        run: python -m pytest mandisense_ai/tests/test_forecasting.py mandisense_ai/tests/test_market_insights.py -q -p no:cacheprovider

      - name: Commit the refreshed artefacts
        run: |
          git config user.name  "mandisense-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/observations/market_observations.parquet \
                     mandisense_ai/models/forecasts/forecast_store.json \
                     mandisense_ai/models/forecast_models/bundle.pkl \
                     mandisense_ai/models/forecast_models/metadata.json
          if git diff --cached --quiet; then
            echo "Nothing changed (feed unchanged or weekend); no commit."
            exit 0
          fi
          git commit -m "Daily data refresh $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
